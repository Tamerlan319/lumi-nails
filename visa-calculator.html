<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Калькулятор стоимости</title>
</head>
<body>
<!-- =========================================================
     КАЛЬКУЛЯТОР ВИЗОВОГО СБОРА ДЛЯ TILDA
     Вставить целиком в блок T123
     Чтобы открыть popup своей кнопкой Tilda:
     укажите ссылку кнопки: #visa-calc
========================================================= -->

<div id="vc-app">

  <!--
      Эту кнопку можно оставить.
      Если используете свою кнопку Tilda со ссылкой #visa-calc,
      удалите этот блок vc-open-wrapper либо скройте его.
  -->
  <div class="vc-open-wrapper">
    <a href="#visa-calc" class="vc-open-button">
      Рассчитать стоимость
    </a>
  </div>

  <!-- POPUP -->
  <div
    class="vc-popup"
    id="vc-popup"
    aria-hidden="true"
  >
    <div class="vc-popup__backdrop" data-vc-close></div>

    <div
      class="vc-popup__window"
      role="dialog"
      aria-modal="true"
      aria-labelledby="vc-title"
    >
      <button
        class="vc-popup__close"
        type="button"
        aria-label="Закрыть"
        data-vc-close
      >
        ×
      </button>

      <div class="vc-popup__content">

        <div class="vc-popup__header">
          <div class="vc-popup__badge">
            Онлайн-расчёт
          </div>

          <h2 id="vc-title">
            Рассчитайте стоимость визы
          </h2>

          <p>
            Выберите подходящий вариант, и калькулятор рассчитает
            стоимость в рублях по актуальному курсу доллара.
          </p>
        </div>

        <!-- ВАРИАНТЫ -->
        <div class="vc-services">

          <label class="vc-service">
            <input
              type="radio"
              name="vc-service"
              value="monthly_rf"
              data-fee="0"
              checked
            >

            <span class="vc-service__box">
              <span class="vc-service__check"></span>

              <span class="vc-service__text">
                <span class="vc-service__title">
                  Виза на месяц
                </span>

                <span class="vc-service__description">
                  Для граждан РФ и Казахстана
                </span>
              </span>

              <span class="vc-service__usd">
                $0
              </span>
            </span>
          </label>


          <label class="vc-service">
            <input
              type="radio"
              name="vc-service"
              value="monthly_other"
              data-fee="29.77"
            >

            <span class="vc-service__box">
              <span class="vc-service__check"></span>

              <span class="vc-service__text">
                <span class="vc-service__title">
                  Виза на месяц
                </span>

                <span class="vc-service__description">
                  Для граждан других стран
                </span>
              </span>

              <span class="vc-service__usd">
                $29.77
              </span>
            </span>
          </label>


          <label class="vc-service">
            <input
              type="radio"
              name="vc-service"
              value="yearly_all"
              data-fee="47.63"
            >

            <span class="vc-service__box">
              <span class="vc-service__check"></span>

              <span class="vc-service__text">
                <span class="vc-service__title">
                  Виза на год
                </span>

                <span class="vc-service__description">
                  Для граждан всех стран
                </span>
              </span>

              <span class="vc-service__usd">
                $47.63
              </span>
            </span>
          </label>


          <label class="vc-service">
            <input
              type="radio"
              name="vc-service"
              value="5years_rf"
              data-fee="142.89"
            >

            <span class="vc-service__box">
              <span class="vc-service__check"></span>

              <span class="vc-service__text">
                <span class="vc-service__title">
                  Виза на 5 лет
                </span>

                <span class="vc-service__description">
                  Для граждан РФ и Казахстана
                </span>
              </span>

              <span class="vc-service__usd">
                $142.89
              </span>
            </span>
          </label>


          <label class="vc-service">
            <input
              type="radio"
              name="vc-service"
              value="5years_other"
              data-fee="238.14"
            >

            <span class="vc-service__box">
              <span class="vc-service__check"></span>

              <span class="vc-service__text">
                <span class="vc-service__title">
                  Виза на 5 лет
                </span>

                <span class="vc-service__description">
                  Для граждан других стран
                </span>
              </span>

              <span class="vc-service__usd">
                $238.14
              </span>
            </span>
          </label>

        </div>


        <button
          type="button"
          class="vc-calculate"
          id="vc-calculate"
        >
          <span class="vc-calculate__text">
            Рассчитать стоимость
          </span>

          <span class="vc-calculate__loader"></span>
        </button>


        <!-- РЕЗУЛЬТАТ -->
        <div
          class="vc-result"
          id="vc-result"
          aria-live="polite"
        >
          <div class="vc-result__caption">
            Стоимость услуги
          </div>

          <div class="vc-result__price">
            <span id="vc-result-price">0</span>
            <span class="vc-result__currency">₽</span>
          </div>

          <div
            class="vc-result__rate"
            id="vc-result-rate"
          ></div>
        </div>


        <!-- ОШИБКА -->
        <div
          class="vc-error"
          id="vc-error"
          aria-live="polite"
        ></div>


        <div class="vc-note">
          Итоговая стоимость рассчитывается автоматически
          на основании актуального курса USD/RUB.
        </div>

      </div>
    </div>
  </div>

</div>


<style>

/* =========================================================
   БАЗОВЫЕ СТИЛИ
========================================================= */

#vc-app,
#vc-app * {
  box-sizing: border-box;
}

#vc-app {
  font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   КНОПКА ОТКРЫТИЯ
========================================================= */

.vc-open-wrapper {
  display: flex;
  justify-content: center;
  width: 100%;
}

.vc-open-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-height: 56px;
  padding: 0 34px;

  border-radius: 14px;

  background: #ff6b35;
  color: #ffffff !important;

  font-size: 17px;
  font-weight: 700;
  line-height: 1;

  text-decoration: none !important;

  cursor: pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;

  box-shadow:
    0 10px 30px rgba(255, 107, 53, .25);
}

.vc-open-button:hover {
  background: #f15f2b;
  transform: translateY(-2px);
  box-shadow:
    0 14px 36px rgba(255, 107, 53, .32);
}


/* =========================================================
   POPUP
========================================================= */

.vc-popup {
  position: fixed;
  z-index: 999999;

  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.vc-popup.vc-popup--open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.vc-popup__backdrop {
  position: absolute;
  inset: 0;

  background:
    rgba(15, 20, 30, .68);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.vc-popup__window {
  position: relative;
  z-index: 2;

  width: 100%;
  max-width: 610px;

  max-height: calc(100vh - 48px);

  overflow-y: auto;
  overscroll-behavior: contain;

  background: #ffffff;

  border-radius: 26px;

  box-shadow:
    0 30px 100px rgba(0, 0, 0, .25);

  transform:
    translateY(20px)
    scale(.98);

  transition:
    transform .25s ease;
}

.vc-popup.vc-popup--open .vc-popup__window {
  transform:
    translateY(0)
    scale(1);
}


/* =========================================================
   КРЕСТИК
========================================================= */

.vc-popup__close {
  position: absolute;

  top: 16px;
  right: 16px;

  z-index: 5;

  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border: 0;
  border-radius: 50%;

  background: #f3f4f6;

  color: #222222;

  font-size: 30px;
  font-weight: 300;
  line-height: 1;

  cursor: pointer;

  transition:
    background .2s ease,
    transform .2s ease;
}

.vc-popup__close:hover {
  background: #e9eaec;
  transform: rotate(5deg);
}


/* =========================================================
   КОНТЕНТ
========================================================= */

.vc-popup__content {
  padding: 38px;
}

.vc-popup__header {
  padding-right: 35px;
  margin-bottom: 28px;
}

.vc-popup__badge {
  display: inline-flex;

  padding: 8px 12px;

  margin-bottom: 14px;

  border-radius: 100px;

  background: #fff1eb;
  color: #ff6b35;

  font-size: 12px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: .06em;
}

.vc-popup__header h2 {
  margin: 0 0 10px;

  color: #171717;

  font-size: 30px;
  line-height: 1.15;
  font-weight: 750;
}

.vc-popup__header p {
  max-width: 500px;

  margin: 0;

  color: #727272;

  font-size: 15px;
  line-height: 1.55;
}


/* =========================================================
   УСЛУГИ
========================================================= */

.vc-services {
  display: flex;
  flex-direction: column;

  gap: 10px;

  margin-bottom: 22px;
}

.vc-service {
  display: block;

  margin: 0;
  padding: 0;

  cursor: pointer;
}

.vc-service input {
  position: absolute;

  width: 1px;
  height: 1px;

  opacity: 0;
  pointer-events: none;
}

.vc-service__box {
  width: 100%;

  display: flex;
  align-items: center;

  gap: 14px;

  min-height: 76px;

  padding: 14px 16px;

  border: 1.5px solid #e9e9e9;
  border-radius: 16px;

  background: #ffffff;

  transition:
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease,
    transform .2s ease;
}

.vc-service__box:hover {
  border-color: #ffb89f;

  transform: translateY(-1px);
}

.vc-service input:checked + .vc-service__box {
  border-color: #ff6b35;

  background: #fff9f6;

  box-shadow:
    0 7px 22px rgba(255, 107, 53, .10);
}

.vc-service__check {
  position: relative;

  flex: 0 0 auto;

  width: 22px;
  height: 22px;

  border: 2px solid #d3d3d3;
  border-radius: 50%;

  background: white;

  transition:
    border-color .2s ease,
    background .2s ease;
}

.vc-service input:checked
+ .vc-service__box
.vc-service__check {
  border-color: #ff6b35;
  background: #ff6b35;
}

.vc-service input:checked
+ .vc-service__box
.vc-service__check::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: white;

  transform: translate(-50%, -50%);
}

.vc-service__text {
  display: flex;
  flex-direction: column;

  gap: 4px;

  flex: 1;

  min-width: 0;
}

.vc-service__title {
  color: #202020;

  font-size: 16px;
  line-height: 1.25;
  font-weight: 700;
}

.vc-service__description {
  color: #818181;

  font-size: 13px;
  line-height: 1.35;
}

.vc-service__usd {
  flex: 0 0 auto;

  padding-left: 10px;

  color: #333333;

  font-size: 15px;
  font-weight: 700;
}


/* =========================================================
   КНОПКА РАСЧЁТА
========================================================= */

.vc-calculate {
  position: relative;

  width: 100%;
  min-height: 58px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin: 0;

  border: none;
  border-radius: 15px;

  background: #ff6b35;
  color: white;

  font-family: inherit;
  font-size: 17px;
  font-weight: 700;

  cursor: pointer;

  box-shadow:
    0 10px 28px rgba(255, 107, 53, .20);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.vc-calculate:hover {
  background: #f15f2b;

  transform: translateY(-1px);

  box-shadow:
    0 14px 32px rgba(255, 107, 53, .27);
}

.vc-calculate:disabled {
  cursor: wait;

  opacity: .82;

  transform: none;
}


/* loader */

.vc-calculate__loader {
  display: none;

  width: 20px;
  height: 20px;

  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #ffffff;
  border-radius: 50%;

  animation: vc-spin .7s linear infinite;
}

.vc-calculate.vc-loading
.vc-calculate__text {
  display: none;
}

.vc-calculate.vc-loading
.vc-calculate__loader {
  display: block;
}

@keyframes vc-spin {
  to {
    transform: rotate(360deg);
  }
}


/* =========================================================
   РЕЗУЛЬТАТ
========================================================= */

.vc-result {
  display: none;

  margin-top: 18px;

  padding: 22px 20px;

  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      #fff5f0 0%,
      #fffafa 100%
    );

  border: 1px solid #ffe2d7;

  text-align: center;
}

.vc-result.vc-result--show {
  display: block;

  animation: vc-result-show .3s ease;
}

@keyframes vc-result-show {
  from {
    opacity: 0;
    transform: translateY(7px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.vc-result__caption {
  margin-bottom: 5px;

  color: #777777;

  font-size: 13px;
  line-height: 1.4;
}

.vc-result__price {
  color: #171717;

  font-size: 38px;
  font-weight: 800;
  line-height: 1.15;
}

.vc-result__currency {
  font-size: .7em;
  font-weight: 700;
}

.vc-result__rate {
  margin-top: 8px;

  color: #858585;

  font-size: 12px;
  line-height: 1.4;
}


/* =========================================================
   ОШИБКА
========================================================= */

.vc-error {
  display: none;

  margin-top: 15px;

  padding: 13px 15px;

  border: 1px solid #ffd3d3;

  background: #fff5f5;

  color: #c94141;

  font-size: 13px;

  text-align: center;
}

.vc-error.vc-error--show {
  display: block;
}


/* =========================================================
   ПРИМЕЧАНИЕ
========================================================= */

.vc-note {
  margin-top: 15px;

  color: #a0a0a0;

  font-size: 11px;
  line-height: 1.45;

  text-align: center;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 640px) {

  .vc-popup {
    align-items: flex-start;

    padding: 0;
  }

  .vc-popup__window {
    max-height: 100dvh;

    border-radius: 24px 24px 0 0;

    transform:
      translateY(30px);
  }

  .vc-popup__content {
    padding:
      30px 18px
      calc(24px + env(safe-area-inset-bottom));
  }

  .vc-popup__header {
    padding-right: 38px;
  }

  .vc-popup__header h2 {
    font-size: 25px;
  }

  .vc-popup__header p {
    font-size: 14px;
  }

  .vc-service__box {
    min-height: 70px;

    gap: 11px;

    padding: 13px;
  }

  .vc-service__title {
    font-size: 14px;
  }

  .vc-service__description {
    font-size: 12px;
  }

  .vc-service__usd {
    font-size: 13px;
  }

  .vc-result__price {
    font-size: 34px;
  }

  .vc-popup__close {
    top: 12px;
    right: 12px;
  }

}

</style>


<script>
(function () {

  /* =======================================================
     НАСТРОЙКИ
  ======================================================= */

  /*
    API курса.
    Возвращает официальный курс USD/RUB,
    который используется в исходной версии калькулятора.
  */
  const RATE_API = '/api/usd-rate';
  const FALLBACK_RATE_API = 'https://www.cbr-xml-daily.ru/daily_json.js';

  /*
    Время хранения успешно полученного курса:
    1 час.
    Это уменьшает количество запросов к API.
  */
  const CACHE_TIME =
    60 * 60 * 1000;


  /* =======================================================
     ЭЛЕМЕНТЫ
  ======================================================= */

  const popup =
    document.getElementById('vc-popup');

  const calculateButton =
    document.getElementById('vc-calculate');

  const result =
    document.getElementById('vc-result');

  const resultPrice =
    document.getElementById('vc-result-price');

  const resultRate =
    document.getElementById('vc-result-rate');

  const errorBlock =
    document.getElementById('vc-error');


  if (!popup || !calculateButton) {
    return;
  }


  /* =======================================================
     ФОРМАТ ЦЕНЫ
  ======================================================= */

  function formatPrice(value) {

    return new Intl.NumberFormat('ru-RU', {
      maximumFractionDigits: 0
    }).format(value);

  }


  /* =======================================================
     ФОРМАТ ДАТЫ
  ======================================================= */

  function formatDate(dateString) {

    if (!dateString) {
      return '';
    }

    const date =
      new Date(dateString);

    if (isNaN(date.getTime())) {
      return '';
    }

    return date.toLocaleDateString('ru-RU');

  }


  /* =======================================================
     ОТКРЫТИЕ POPUP
  ======================================================= */

  function openPopup() {

    popup.classList.add(
      'vc-popup--open'
    );

    popup.setAttribute(
      'aria-hidden',
      'false'
    );

    document.documentElement.style.overflow =
      'hidden';

    document.body.style.overflow =
      'hidden';

  }


  /* =======================================================
     ЗАКРЫТИЕ POPUP
  ======================================================= */

  function closePopup() {

    popup.classList.remove(
      'vc-popup--open'
    );

    popup.setAttribute(
      'aria-hidden',
      'true'
    );

    document.documentElement.style.overflow =
      '';

    document.body.style.overflow =
      '';

  }


  /* =======================================================
     ОТКРЫТИЕ ПО ССЫЛКЕ #visa-calc

     Благодаря этому можно создать обычную кнопку в Tilda
     и указать ей ссылку:

     #visa-calc
  ======================================================= */

  document.addEventListener(
    'click',
    function (event) {

      const link =
        event.target.closest(
          'a[href="#visa-calc"]'
        );

      if (!link) {
        return;
      }

      event.preventDefault();

      openPopup();

    }
  );


  /* =======================================================
     ЗАКРЫТИЕ ПО КРЕСТИКУ / ФОНУ
  ======================================================= */

  document.addEventListener(
    'click',
    function (event) {

      if (
        event.target.closest(
          '[data-vc-close]'
        )
      ) {

        closePopup();

      }

    }
  );


  /* =======================================================
     ESC
  ======================================================= */

  document.addEventListener(
    'keydown',
    function (event) {

      if (
        event.key === 'Escape' &&
        popup.classList.contains(
          'vc-popup--open'
        )
      ) {

        closePopup();

      }

    }
  );


  /* =======================================================
     CACHE
  ======================================================= */

  function saveRateToCache(rate, date) {

    try {

      localStorage.setItem(
        'vc_usd_rate',
        JSON.stringify({
          rate: rate,
          date: date,
          savedAt: Date.now()
        })
      );

    } catch (error) {
      /* localStorage может быть недоступен */
    }

  }


  function getCachedRate() {

    try {

      const raw =
        localStorage.getItem(
          'vc_usd_rate'
        );

      if (!raw) {
        return null;
      }

      const data =
        JSON.parse(raw);

      if (
        !data ||
        !data.rate ||
        !data.savedAt
      ) {
        return null;
      }

      if (
        Date.now() - data.savedAt >
        CACHE_TIME
      ) {
        return null;
      }

      return data;

    } catch (error) {

      return null;

    }

  }


  /* =======================================================
     ПОЛУЧЕНИЕ КУРСА USD
  ======================================================= */

  async function getDollarRate() {

    /*
      Сначала проверяем кеш.
    */

    const cached =
      getCachedRate();

    if (cached) {

      return {
        rate: Number(cached.rate),
        date: cached.date,
        cached: true
      };

    }


    /*
      Запрашиваем свежий курс.
    */

    const controller =
      new AbortController();

    const timeout =
      setTimeout(function () {

        controller.abort();

      }, 8000);


    try {

      let response;
      let data;
      let rate;
      let rateDate = '';

      try {
        response = await fetch(RATE_API, {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        });

        if (!response.ok) throw new Error('Local API unavailable');
        data = await response.json();
        rate = Number(data.rate);
        rateDate = data.date || '';
      } catch (localError) {
        response = await fetch(FALLBACK_RATE_API, {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error('Ошибка API: ' + response.status);
        }

        data = await response.json();
        rate = Number(data?.Valute?.USD?.Value);
        rateDate = data?.Date || '';
      }


      if (
        !Number.isFinite(rate) ||
        rate <= 0
      ) {

        throw new Error(
          'Получено некорректное значение курса'
        );

      }


      saveRateToCache(
        rate,
        rateDate || ''
      );


      return {
        rate: rate,
        date: rateDate || '',
        cached: false
      };


    } finally {

      clearTimeout(timeout);

    }

  }


  /* =======================================================
     ПОКАЗАТЬ ОШИБКУ
  ======================================================= */

  function showError(message) {

    result.classList.remove(
      'vc-result--show'
    );

    errorBlock.textContent =
      message;

    errorBlock.classList.add(
      'vc-error--show'
    );

  }


  /* =======================================================
     СКРЫТЬ ОШИБКУ
  ======================================================= */

  function hideError() {

    errorBlock.classList.remove(
      'vc-error--show'
    );

    errorBlock.textContent = '';

  }


  /* =======================================================
     СОСТОЯНИЕ ЗАГРУЗКИ
  ======================================================= */

  function setLoading(isLoading) {

    calculateButton.disabled =
      isLoading;

    calculateButton.classList.toggle(
      'vc-loading',
      isLoading
    );

  }


  /* =======================================================
     РАСЧЁТ
  ======================================================= */

  async function calculate() {

    hideError();

    const selected =
      document.querySelector(
        'input[name="vc-service"]:checked'
      );


    if (!selected) {

      showError(
        'Пожалуйста, выберите услугу.'
      );

      return;

    }


    const dollarPrice =
      Number(
        selected.dataset.fee
      );


    if (
      !Number.isFinite(dollarPrice)
    ) {

      showError(
        'Не удалось определить стоимость услуги.'
      );

      return;

    }


    /*
      Бесплатный вариант.
      Получать курс для него необязательно.
    */

    if (dollarPrice === 0) {

      resultPrice.textContent =
        '0';

      resultRate.textContent =
        'Для выбранного варианта визовый сбор отсутствует.';

      result.classList.add(
        'vc-result--show'
      );

      return;

    }


    setLoading(true);


    try {

      const rateData =
        await getDollarRate();


      /*
        Формула:
        стоимость в USD × курс USD/RUB
      */

      const total =
        Math.round(
          dollarPrice *
          rateData.rate
        );


      resultPrice.textContent =
        formatPrice(total);


      const date =
        formatDate(
          rateData.date
        );


      let rateText =
        'Курс USD: 1 $ = ' +
        rateData.rate.toFixed(2)
          .replace('.', ',') +
        ' ₽';


      if (date) {

        rateText +=
          ' · курс на ' +
          date;

      }


      resultRate.textContent =
        rateText;


      result.classList.add(
        'vc-result--show'
      );


    } catch (error) {

      console.error(
        'Ошибка калькулятора:',
        error
      );


      showError(
        'Не удалось получить актуальный курс доллара. ' +
        'Пожалуйста, попробуйте ещё раз.'
      );


    } finally {

      setLoading(false);

    }

  }


  /* =======================================================
     КНОПКА РАССЧИТАТЬ
  ======================================================= */

  calculateButton.addEventListener(
    'click',
    calculate
  );


  /* =======================================================
     ПРИ СМЕНЕ УСЛУГИ СТАРЫЙ РЕЗУЛЬТАТ УБИРАЕТСЯ
  ======================================================= */

  document.querySelectorAll(
    'input[name="vc-service"]'
  ).forEach(function (radio) {

    radio.addEventListener(
      'change',
      function () {

        result.classList.remove(
          'vc-result--show'
        );

        hideError();

      }
    );

  });


  /* =======================================================
     ЕСЛИ СТРАНИЦУ ОТКРЫЛИ С #visa-calc
  ======================================================= */

  if (
    window.location.hash ===
    '#visa-calc'
  ) {

    setTimeout(
      openPopup,
      150
    );

  }

})();
</script>
